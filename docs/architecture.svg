<svg viewBox="0 0 1440 1080" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#F2C14E"/></marker>
    <marker id="mBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5B9DFF"/></marker>
    <marker id="mGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5CCB8B"/></marker>
    <marker id="mMute" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8A95A3"/></marker>
  </defs>
  <rect x="0" y="0" width="1440" height="1080" fill="#15191F"/>
  <text x="48" y="58" font-size="26" font-weight="700" fill="#EDF0F4">MCP Gatehound — an authenticated MCP gateway</text>
  <text x="48" y="84" font-size="14" font-weight="400" fill="#96A1AE">agent or browser → Cloudflare Access → tunnel → the gateway → upstreams declared in config</text>
  <text x="48" y="126" font-size="12" font-weight="700" fill="#7A8695" letter-spacing="1.6">THE REQUEST PATH</text>
  <line x1="48" y1="136" x2="1392" y2="136" stroke="#2C3540" stroke-width="1"/>
  <rect x="48" y="152" width="236" height="140" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="70" y="186" font-size="15" font-weight="600" fill="#EDF0F4">Agent · browser · phone</text>
  <text x="70" y="214" font-size="13" font-weight="400" fill="#96A1AE">speaks MCP over HTTPS</text>
  <text x="70" y="238" font-size="12" font-weight="400" fill="#7A8695" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /mcp · JSON-RPC 2.0</text>
  <text x="70" y="266" font-size="12" font-weight="400" fill="#7A8695">one endpoint, not N integrations</text>
  <path d="M292,222.0 L336,222.0" stroke="#5B9DFF" stroke-width="2" fill="none" marker-end="url(#mBlue)"/>
  <rect x="344" y="152" width="268" height="140" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="366" y="186" font-size="15" font-weight="600" fill="#EDF0F4">Cloudflare Access + Tunnel</text>
  <text x="366" y="214" font-size="13" font-weight="400" fill="#96A1AE">identity: a person&#x27;s email, or</text>
  <text x="366" y="234" font-size="13" font-weight="400" fill="#96A1AE">service token&#x27;s common_name</text>
  <text x="366" y="266" font-size="12" font-weight="400" fill="#7A8695">nothing is exposed directly</text>
  <path d="M620,222.0 L664,222.0" stroke="#5B9DFF" stroke-width="2" fill="none" marker-end="url(#mBlue)"/>
  <rect x="672" y="152" width="300" height="140" rx="10" fill="#222A33" stroke="#F2C14E" stroke-width="1"/>
  <text x="694" y="186" font-size="15" font-weight="700" fill="#EDF0F4">MCP Gatehound</text>
  <text x="694" y="214" font-size="13" font-weight="400" fill="#96A1AE">bound to 127.0.0.1 — it refuses</text>
  <text x="694" y="234" font-size="13" font-weight="400" fill="#96A1AE">to start on any other address</text>
  <text x="694" y="266" font-size="12" font-weight="400" fill="#F2C14E">gateway · GUI · SQLite · one process</text>
  <path d="M980,222.0 L1024,222.0" stroke="#5CCB8B" stroke-width="2" fill="none" marker-end="url(#mGreen)"/>
  <rect x="1032" y="152" width="360" height="140" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="1054" y="182" font-size="13" font-weight="600" fill="#EDF0F4">Upstreams — whatever config declares</text>
  <circle cx="1062" cy="204" r="3.5" fill="#5CCB8B"/>
  <text x="1076" y="208" font-size="12" font-weight="600" fill="#EDF0F4">A REST API</text>
  <text x="1076" y="224" font-size="11" font-weight="400" fill="#7A8695">named ops: method, path, query, body</text>
  <circle cx="1062" cy="240" r="3.5" fill="#5CCB8B"/>
  <text x="1076" y="244" font-size="12" font-weight="600" fill="#EDF0F4">Another MCP server</text>
  <text x="1076" y="260" font-size="11" font-weight="400" fill="#7A8695">contributes only the tools you declare</text>
  <circle cx="1062" cy="276" r="3.5" fill="#F2C14E"/>
  <text x="1076" y="280" font-size="12" font-weight="600" fill="#EDF0F4">A local command</text>
  <text x="1076" y="296" font-size="11" font-weight="400" fill="#7A8695">argv only, never a shell</text>
  <text x="48" y="330" font-size="12" font-weight="700" fill="#7A8695" letter-spacing="1.6">ONE PROCESS, ONE LIFECYCLE</text>
  <line x1="48" y1="340" x2="1392" y2="340" stroke="#2C3540" stroke-width="1"/>
  <rect x="48" y="356" width="432" height="176" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="70" y="386" font-size="14" font-weight="600" fill="#EDF0F4">Tray icon — the primary surface</text>
  <circle cx="76" cy="412" r="5" fill="#5CCB8B"/>
  <text x="92" y="416" font-size="13" font-weight="400" fill="#96A1AE">green — listening</text>
  <circle cx="76" cy="438" r="5" fill="#8A95A3"/>
  <text x="92" y="442" font-size="13" font-weight="400" fill="#96A1AE">grey — paused</text>
  <circle cx="76" cy="464" r="5" fill="#E0685F"/>
  <text x="92" y="468" font-size="13" font-weight="400" fill="#96A1AE">red — an upstream is not answering</text>
  <text x="70" y="506" font-size="12" font-weight="400" fill="#7A8695">a badge counts waiting approvals · one notification each</text>
  <rect x="504" y="356" width="432" height="176" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="526" y="386" font-size="14" font-weight="600" fill="#EDF0F4">WebView window — no state of record</text>
  <rect x="526" y="402" width="190" height="26" rx="6" fill="#222A33" stroke="#2C3540"/>
  <text x="538" y="420" font-size="12" font-weight="400" fill="#96A1AE">Approvals</text>
  <rect x="732" y="402" width="190" height="26" rx="6" fill="#222A33" stroke="#2C3540"/>
  <text x="744" y="420" font-size="12" font-weight="400" fill="#96A1AE">Live log</text>
  <rect x="526" y="432" width="190" height="26" rx="6" fill="#222A33" stroke="#2C3540"/>
  <text x="538" y="450" font-size="12" font-weight="400" fill="#96A1AE">Upstreams &amp; actions</text>
  <rect x="732" y="432" width="190" height="26" rx="6" fill="#222A33" stroke="#2C3540"/>
  <text x="744" y="450" font-size="12" font-weight="400" fill="#96A1AE">Identities</text>
  <text x="526" y="506" font-size="12" font-weight="400" fill="#7A8695">closing hides it to the tray, and the gateway keeps serving</text>
  <rect x="960" y="356" width="432" height="176" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="982" y="386" font-size="14" font-weight="600" fill="#EDF0F4">cloudflared — a child process</text>
  <text x="982" y="416" font-size="13" font-weight="400" fill="#96A1AE">the tunnel comes up and dies with the app;</text>
  <text x="982" y="438" font-size="13" font-weight="400" fill="#96A1AE">killed explicitly on exit, never orphaned</text>
  <text x="982" y="484" font-size="12" font-weight="400" fill="#7A8695">Quitting cancels the listener, drains in-flight calls,</text>
  <text x="982" y="506" font-size="12" font-weight="400" fill="#7A8695">releases held approvals, and checkpoints the WAL.</text>
  <text x="48" y="574" font-size="12" font-weight="700" fill="#7A8695" letter-spacing="1.6">INSIDE gatehound-core — THE SAME CRATE THE HEADLESS BINARY RUNS</text>
  <line x1="48" y1="584" x2="1392" y2="584" stroke="#2C3540" stroke-width="1"/>
  <rect x="48" y="602" width="250" height="152" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="68" y="630" font-size="14" font-weight="700" fill="#EDF0F4">MCP listener</text>
  <text x="68" y="652" font-size="12" font-weight="400" fill="#96A1AE">axum · POST /mcp</text>
  <text x="68" y="677" font-size="12" font-weight="400" fill="#96A1AE">2026-07-28 served statelessly,</text>
  <text x="68" y="694" font-size="12" font-weight="400" fill="#96A1AE">or a legacy handshake</text>
  <text x="68" y="717" font-size="11" font-weight="400" fill="#7A8695">GET and DELETE return 405</text>
  <path d="M304,678.0 L326,678.0" stroke="#8A95A3" stroke-width="2" fill="none" marker-end="url(#mMute)"/>
  <rect x="334" y="602" width="250" height="152" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="354" y="630" font-size="14" font-weight="700" fill="#EDF0F4">Verify</text>
  <text x="354" y="652" font-size="12" font-weight="400" fill="#96A1AE">two factors, both required</text>
  <text x="354" y="677" font-size="12" font-weight="400" fill="#96A1AE">Access JWT: JWKS · aud · exp</text>
  <text x="354" y="694" font-size="12" font-weight="400" fill="#96A1AE">bearer: constant-time compare</text>
  <text x="354" y="717" font-size="11" font-weight="400" fill="#7A8695">401 carries a challenge; 403 if</text>
  <text x="354" y="732" font-size="11" font-weight="400" fill="#7A8695">authenticated but not permitted</text>
  <path d="M590,678.0 L612,678.0" stroke="#8A95A3" stroke-width="2" fill="none" marker-end="url(#mMute)"/>
  <rect x="620" y="602" width="250" height="152" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="640" y="630" font-size="14" font-weight="700" fill="#EDF0F4">Identity policy</text>
  <text x="640" y="652" font-size="12" font-weight="400" fill="#96A1AE">(identity, tool)</text>
  <text x="640" y="677" font-size="12" font-weight="400" fill="#96A1AE">allow · deny · ask — exact match,</text>
  <text x="640" y="694" font-size="12" font-weight="400" fill="#96A1AE">then *, then ask</text>
  <text x="640" y="717" font-size="11" font-weight="400" fill="#7A8695">deny removes the tool from</text>
  <text x="640" y="732" font-size="11" font-weight="400" fill="#7A8695">tools/list entirely</text>
  <path d="M876,678.0 L898,678.0" stroke="#8A95A3" stroke-width="2" fill="none" marker-end="url(#mMute)"/>
  <rect x="906" y="602" width="250" height="152" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="926" y="630" font-size="14" font-weight="700" fill="#EDF0F4">Action engine</text>
  <text x="926" y="652" font-size="12" font-weight="400" fill="#F2C14E">the caller names a tool,</text>
  <text x="926" y="669" font-size="12" font-weight="400" fill="#F2C14E">never an action</text>
  <text x="926" y="694" font-size="12" font-weight="400" fill="#96A1AE">proxy → an upstream op</text>
  <text x="926" y="711" font-size="12" font-weight="400" fill="#96A1AE">exec → a fixed argv template</text>
  <text x="926" y="734" font-size="11" font-weight="400" fill="#7A8695">an idempotency key is claimed</text>
  <text x="926" y="749" font-size="11" font-weight="400" fill="#7A8695">before and completed after</text>
  <rect x="48" y="806" width="536" height="96" rx="10" fill="#1D232B" stroke="#2C3540" stroke-width="1"/>
  <text x="68" y="834" font-size="13" font-weight="700" fill="#EDF0F4">SQLite — bundled, WAL mode</text>
  <text x="68" y="858" font-size="12" font-weight="400" fill="#96A1AE">the audit log: every request, decision and outcome, denials included</text>
  <text x="68" y="882" font-size="11" font-weight="400" fill="#7A8695">secrets redacted by key · bodies truncated, then blanked, then deleted</text>
  <rect x="620" y="806" width="536" height="96" rx="10" fill="#222A33" stroke="#F2C14E" stroke-width="1"/>
  <text x="640" y="834" font-size="13" font-weight="700" fill="#EDF0F4">Approval queue — a person in the loop</text>
  <text x="640" y="858" font-size="11" font-weight="400" fill="#96A1AE">the HTTP request is parked on a bounded hold — allow once · allow and whitelist · reject</text>
  <text x="640" y="882" font-size="11" font-weight="400" fill="#7A8695">kept under Cloudflare&#x27;s ~100s edge timeout · unanswered returns approval_timeout</text>
  <path d="M745.0,760 L745.0,798" stroke="#F2C14E" stroke-width="2" fill="none" marker-end="url(#mAmber)"/>
  <text x="757.0" y="788" font-size="12" font-weight="400" fill="#F2C14E">ask</text>
  <rect x="48" y="930" width="1344" height="120" rx="10" fill="#222A33" stroke="#2C3540" stroke-width="1"/>
  <text x="72" y="962" font-size="15" font-weight="700" fill="#EDF0F4">Packs — the gateway ships knowing nothing</text>
  <text x="72" y="988" font-size="13" font-weight="400" fill="#96A1AE">Everything it fronts is configuration: an upstream, its named operations, and the tools bound to them. A pack is that configuration as one portable file.</text>
  <text x="72" y="1014" font-size="12" font-weight="400" fill="#5CCB8B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">export  strips every credential and names an environment variable in its place</text>
  <text x="72" y="1034" font-size="12" font-weight="400" fill="#5CCB8B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">import  refuses on the first name collision unless you pass --replace, so a pack cannot quietly redefine an already-approved tool</text>
</svg>
