<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP Gatehound</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="top">
    <header>
      <span id="dot" class="dot"></span>
      <h1>MCP Gatehound</h1>
      <span id="subtitle" class="sub"></span>
      <button id="pause" class="ghost">Pause gateway</button>
    </header>

    <nav>
      <button data-screen="home" class="active">Home <span id="badge" class="badge">0</span></button>
      <button data-screen="upstream">Upstream</button>
      <button data-screen="actions">Downstream</button>
      <button data-screen="network">Network</button>
      <button data-screen="log">Live log</button>
    </nav>
    </div>

    <main>
      <section id="home" class="screen"></section>
      <section id="upstream" class="screen hidden"></section>
      <section id="log" class="screen hidden"></section>
      <section id="actions" class="screen hidden"></section>
      <section id="network" class="screen hidden"></section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
