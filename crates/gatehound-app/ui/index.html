<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d18" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eef0f7" media="(prefers-color-scheme: light)" />
    <title>MCP Gatehound</title>
    <!-- Design system v2.0: the look is copied verbatim from chen97/todo by tools/sync-look.sh
         into public/look/. Load order: tokens, this app's components, the glass layer, then the
         desktop-app shell, which keeps the sidebar at every window size. The app's own CSS is in
         public/ too, so Vite serves it as written and cannot reorder it after the glass layer. -->
    <link rel="stylesheet" href="/look/tokens.css" />
    <link rel="stylesheet" href="/app.css" />
    <link rel="stylesheet" href="/look/glass.css" />
    <link rel="stylesheet" href="/shell.css" />
  </head>
  <body>
    <div class="app">
      <nav class="side" aria-label="Views">
        <span class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg></span>MCP Gatehound</span>
        <button class="nav-item active" data-screen="home" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></svg><span class="nav-name">Home</span><span id="badge" class="badge">0</span></button>
        <button class="nav-item" data-screen="upstream"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="11" rx="2"/><path d="M8.5 19.5h7M12 15.5v4"/></svg><span class="nav-name">Upstream</span></button>
        <button class="nav-item" data-screen="actions"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg><span class="nav-name">Downstream</span></button>
        <button class="nav-item" data-screen="network"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.5 5.3 3.5 8.5s-1.2 6.1-3.5 8.5c-2.3-2.4-3.5-5.3-3.5-8.5s1.2-6.1 3.5-8.5z"/></svg><span class="nav-name">Network</span></button>
        <button class="nav-item" data-screen="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5h14M5 12h14M5 17.5h8.5"/></svg><span class="nav-name">Live log</span></button>
        <button class="nav-item" data-screen="debug"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7.5V6a3 3 0 0 1 6 0v1.5"/><rect x="7" y="7.5" width="10" height="12" rx="5"/><path d="M12 11v8.5M3.5 13H7M17 13h3.5M4.5 8.5L7 10M19.5 8.5L17 10M4.5 18.5L7 17M19.5 18.5L17 17"/></svg><span class="nav-name">Debug</span></button>
      </nav>

      <main>
        <header class="top">
          <div class="top-title">
            <h1 id="title">Home</h1>
            <p class="meta"><span id="dot" class="dot"></span><span id="subtitle"></span></p>
          </div>
          <div class="top-actions">
            <button id="pause" class="ghost">Pause gateway</button>
          </div>
        </header>
        <section id="home" class="screen"></section>
        <section id="upstream" class="screen hidden"></section>
        <section id="log" class="screen hidden"></section>
        <section id="actions" class="screen hidden"></section>
        <section id="network" class="screen hidden"></section>
        <section id="debug" class="screen hidden"></section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
    <div id="modal-root"></div>
  </body>
</html>
