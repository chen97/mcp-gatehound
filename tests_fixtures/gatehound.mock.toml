# The configuration the test rig uses: the gateway fronting tests_fixtures/mock_upstream.py.
#
#   python3 tests_fixtures/mock_upstream.py 23399 &
#   GATEHOUND_TOKEN=hubsecret-0123456789abcdef \
#     cargo run -p gatehound-headless -- --config tests_fixtures/gatehound.mock.toml

listen_addr = "127.0.0.1:8790"
approval_timeout_secs = 10
log_retention_days = 7

[auth]
# Cloudflare Access is deliberately absent: the rig has no edge in front of it. A real
# deployment sets [auth.access], and the gateway warns loudly when it is missing.
bearer_identity = "test-client"

[[upstream]]
name = "notes"
type = "http"
base_url = "http://127.0.0.1:23399"
auth = "bearer"
# The file value is the rig's default; MOCK_UPSTREAM_TOKEN overrides it, which is how a
# real deployment keeps its credential out of the config file.
token = "tok"
token_env = "MOCK_UPSTREAM_TOKEN"
health_path = "/healthz"

[upstream.ops.list]
method = "GET"
path = "/v1/notes"
query = { limit = "{limit}" }

[upstream.ops.read]
method = "GET"
path = "/v1/notes/{id}"

[upstream.ops.append]
method = "POST"
path = "/v1/notes/{id}"
body = { body = "{body}" }

[[identity]]
identity = "test-client"
tool = "*"
decision = "allow"

[[tool]]
name = "list_notes"
description = "List the notes this upstream holds."
action = { type = "proxy", upstream = "notes", op = "list" }
input_schema = { type = "object", properties = { limit = { type = "integer" } } }

[[tool]]
name = "read_note"
description = "Read one note by id."
action = { type = "proxy", upstream = "notes", op = "read" }
input_schema = { type = "object", properties = { id = { type = "string" } }, required = ["id"] }

[[tool]]
name = "append_note"
description = "Append to a note. Requires an idempotency key; repeating one replays the first result."
action = { type = "proxy", upstream = "notes", op = "append" }
rate_limit = { per_hour = 60, min_spacing_secs = 0 }
idempotent = true
input_schema = { type = "object", properties = { id = { type = "string" }, body = { type = "string" }, idempotency_key = { type = "string" } }, required = ["id", "body", "idempotency_key"] }

[[tool]]
name = "disk_free"
description = "Free space on this machine."
action = { type = "exec", cmd = "/bin/df", args = ["-h", "/"], timeout_secs = 10, max_output_bytes = 8192 }
